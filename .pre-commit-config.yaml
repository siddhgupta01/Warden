# Pre-commit hooks: run locally on every commit so bad content never lands.
#
# One-time setup:
#   pip install pre-commit
#   pre-commit install
# Run against all files on demand:
#   pre-commit run --all-files
#
# terraform_* hooks require terraform and tflint on your PATH. If a hook is ever
# skipped locally, the GitHub Actions CI is the backstop.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
      - id: terraform_tflint
