[project]
name = "warden-agent"
version = "0.1.0"
description = "Warden: detects and remediates AWS security issues"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "moto[s3,ec2,iam]>=5.0",
  "pytest>=8.0",
]

[project.scripts]
warden = "warden_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
